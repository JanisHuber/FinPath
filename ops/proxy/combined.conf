# Upstream definitions
upstream finpath_frontend_dev {
    server frontend-web-dev:80;
}

upstream finpath_backend_dev {
    server backend-dev:9080;
}

upstream finpath_frontend_prd {
    server frontend-web-prod:80;
}

upstream finpath_backend_prd {
    server backend-prod:9080;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=dev_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=prd_api_limit:10m rate=10r/s;

# ============================================================================
# DEV ENVIRONMENT - dev.css-appli24.com
# ============================================================================

# Redirect HTTP to HTTPS for dev
server {
    listen 80;
    server_name dev.css-appli24.com;

    return 301 https://$host$request_uri;
}

# HTTPS server for dev
server {
    listen 443 ssl http2;
    server_name dev.css-appli24.com;

    # SSL Certificates - Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/certs/dev-cloudflare-cert.pem;
    ssl_certificate_key /etc/nginx/certs/dev-cloudflare-key.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://dev.css-appli24.com;" always;

    # API Routing
    location /api/ {
        # Apply rate limiting
        limit_req zone=dev_api_limit burst=50 nodelay;

        proxy_pass http://finpath_backend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no rate limiting)
    location /actuator/health {
        proxy_pass http://finpath_backend_dev;
        proxy_set_header Host $host;
        access_log off;
    }

    # Frontend Routing
    location / {
        proxy_pass http://finpath_frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ============================================================================
# PRODUCTION ENVIRONMENT - css-appli24.com
# ============================================================================

# Redirect HTTP to HTTPS for production
server {
    listen 80;
    server_name css-appli24.com www.css-appli24.com;
    return 301 https://css-appli24.com$request_uri;
}

# Main HTTPS server for production
server {
    listen 443 ssl http2;
    server_name css-appli24.com;

    # SSL Certificates - Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/certs/cloudflare-cert.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-key.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://css-appli24.com;" always;

    # API Routing (stricter rate limiting for production)
    location /api/ {
        limit_req zone=prd_api_limit burst=20 nodelay;

        proxy_pass http://finpath_backend_prd;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (no rate limiting)
    location /actuator/health {
        proxy_pass http://finpath_backend_prd;
        proxy_set_header Host $host;
        access_log off;
    }

    # Frontend Routing
    location / {
        proxy_pass http://finpath_frontend_prd;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Redirect www to non-www for production
server {
    listen 443 ssl http2;
    server_name www.css-appli24.com;

    ssl_certificate     /etc/nginx/certs/cloudflare-cert.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-key.pem;

    return 301 https://css-appli24.com$request_uri;
}
