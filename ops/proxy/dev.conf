upstream finpath_frontend_dev {
    server finpath-frontend-web-dev:80;
}

server {
    listen 80;
    server_name dev.css-appli24.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.css-appli24.com;

    ssl_certificate     /etc/letsencrypt/live/dev.css-appli24.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.css-appli24.com/privkey.pem;

    # Optional: sichere Defaults
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://finpath_frontend_dev;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}