services:
  reverse-proxy:
    image: nginx:alpine
    container_name: finpath-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/finpath/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend-web-prod
      - backend-prod
    networks:
      - finpath-net
    restart: always

  backend-prod:
    image: ghcr.io/janishuber/finpath-backend:prod
    container_name: finpath-backend-prod
    env_file: ./environments/prod.env
    environment:
      # Spring Boot profile
      SPRING_PROFILES_ACTIVE: prd
      # JVM Options for production
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    expose:
      - "9080"
    networks:
      - finpath-net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend-web-prod:
    image: ghcr.io/janishuber/finpath-frontend-web:prod
    container_name: finpath-frontend-web-prod
    expose:
      - "80"
    depends_on:
      - backend-prod
    networks:
      - finpath-net
    restart: always

networks:
  finpath-net:
    external: true
