user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Upstream definitions
    upstream finpath_frontend_dev {
        server finpath-frontend-web-dev:80;
    }

    upstream finpath_backend_dev {
        server finpath-backend-dev:9080;
    }

    upstream finpath_frontend_prod {
        server finpath-frontend-web-prod:80;
    }

    upstream finpath_backend_prod {
        server finpath-backend-prod:9080;
    }

    # ============================================================================
    # DEV ENVIRONMENT - dev.css-appli24.com
    # ============================================================================
    server {
        listen 80;
        server_name dev.css-appli24.com;

        # API Routing
        location /api/ {
            proxy_pass http://finpath_backend_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /actuator/health {
            proxy_pass http://finpath_backend_dev;
            proxy_set_header Host $host;
            access_log off;
        }

        # Frontend Routing
        location / {
            proxy_pass http://finpath_frontend_dev;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================================================
    # PRODUCTION ENVIRONMENT - css-appli24.com
    # ============================================================================
    server {
        listen 80;
        server_name css-appli24.com www.css-appli24.com;

        # API Routing
        location /api/ {
            proxy_pass http://finpath_backend_prod;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /actuator/health {
            proxy_pass http://finpath_backend_prod;
            proxy_set_header Host $host;
            access_log off;
        }

        # Frontend Routing
        location / {
            proxy_pass http://finpath_frontend_prod;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ============================================================================
    # DEFAULT SERVER (wenn kein Domain-Name matcht)
    # ============================================================================
    server {
        listen 80 default_server;
        server_name _;

        # Zeige eine Info-Seite oder leite zu PROD
        location / {
            return 301 http://css-appli24.com$request_uri;
        }
    }
}
