events {
    worker_connections 512;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # PRODUCTION - Port 8080
    # NPM routet wealthjoe.app hierher
    server {
        listen 8080;

        location /api/ {
            set $api_upstream backend-prod;
            proxy_pass http://$api_upstream:9080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend-web-prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # DEVELOPMENT - Port 8081
    # NPM routet dev.wealthjoe.app hierher
    server {
        listen 8081;

        location /api/ {
            set $api_upstream backend-dev;
            proxy_pass http://$api_upstream:9080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend-web-dev:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
