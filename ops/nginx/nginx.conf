events {
    worker_connections 512;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # PRODUCTION - css-appli24.com
    server {
        listen 80;
        server_name css-appli24.com www.css-appli24.com;

        # API Routing
        location /api/ {
            set $api_upstream backend-prod;
            proxy_pass http://$api_upstream:9080;
            proxy_set_header Host $host;
        }

        # Frontend Routing
        location / {
            proxy_pass http://frontend-web-prod:80;
            proxy_set_header Host $host;
        }
    }

    # DEVELOPMENT - dev.css-appli24.com
    server {
        listen 80;
        server_name dev.css-appli24.com www.dev.css-appli24.com;

        # API Routing
        location /api/ {
            set $api_upstream backend-dev;
            proxy_pass http://$api_upstream:9080;
            proxy_set_header Host $host;
        }

        # Frontend Routing
        location / {
            proxy_pass http://frontend-web-dev:80;
            proxy_set_header Host $host;
        }
    }

    # Default - block unknown requests
    server {
        listen 80 default_server;
        return 444;
    }
}