events {
    worker_connections 512;
}

http {
    # Minimal logging
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ============================================================================
    # DEV ENVIRONMENT - dev.css-appli24.com
    # ============================================================================
    server {
        listen 80;
        server_name dev.css-appli24.com;

        # API Routing
        location /api/ {
            proxy_pass http://finpath-backend-dev:9080;
            proxy_set_header Host $host;
        }

        # Frontend Routing
        location / {
            proxy_pass http://finpath-frontend-web-dev:80;
            proxy_set_header Host $host;
        }
    }

    # ============================================================================
    # PRODUCTION ENVIRONMENT - css-appli24.com
    # ============================================================================
    server {
        listen 80;
        server_name css-appli24.com www.css-appli24.com;

        # API Routing
        location /api/ {
            proxy_pass http://finpath-backend-prod:9080;
            proxy_set_header Host $host;
        }

        # Frontend Routing
        location / {
            proxy_pass http://finpath-frontend-web-prod:80;
            proxy_set_header Host $host;
        }
    }

    # ============================================================================
    # DEFAULT SERVER - direct IP access
    # ============================================================================
    server {
        listen 80 default_server;
        return 444;
    }
}
