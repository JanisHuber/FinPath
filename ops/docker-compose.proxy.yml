services:
  reverse-proxy:
    image: nginx:alpine
    container_name: finpath-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"      # PROD
      - "8080:8080"  # DEV
    networks:
      - finpath-net
    restart: always

networks:
  finpath-net:
    name: finpath-net
    driver: bridge
