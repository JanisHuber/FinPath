services:
  proxy-dev:
    image: nginx:alpine
    container_name: finpath-proxy-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/dev.conf:/etc/nginx/conf.d/default.conf:ro
    # - ./proxy/certs:/etc/letsencrypt:ro   # todo: TLS certs for dev
    networks:
      - finpath-net
    depends_on:
      - frontend-web-dev
    restart: always

networks:
  finpath-net:
    external: true