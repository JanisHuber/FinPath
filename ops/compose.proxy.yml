services:
  reverse-proxy:
    image: nginx:alpine
    container_name: finpath-proxy
    ports:
      - "80:80"
      - "443:443"           # für späteres TLS
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/conf.d:/etc/nginx/conf.d:ro
      # - ./proxy/certs:/etc/letsencrypt:ro   # später, wenn du Certbot o.ä. nutzt
    networks:
      - finpath-net
    restart: always

networks:
  finpath-net:
    external: true