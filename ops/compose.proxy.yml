services:
  proxy:
    image: nginx:alpine
    container_name: finpath-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/combined.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/finpath/certs:/etc/nginx/certs:ro
    networks:
      - finpath-net
    depends_on:
      - backend-dev
      - frontend-web-dev
      - backend-prod
      - frontend-web-prod
    restart: always

networks:
  finpath-net:
    external: true
