services:
  db:
    image: postgres:16
    env_file: ./secrets/.env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    # In Prod normalerweise KEIN Port nach außen!
    # ports:
    #   - "5432:5432"
    restart: always

  backend:
    image: ghcr.io/janishuber/finpath-backend:prod
    env_file: ./secrets/.env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    ports:
      - "9080:9080"   # optional: oder hinter Reverse Proxy / Traefik / Caddy
    restart: always

  frontend-web:
    image: ghcr.io/janishuber/finpath-frontend-web:prod
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: always

  # Optional: Mobile-Web-Build als Preview (nicht für reale App nötig)
  frontend-mobile:
    image: ghcr.io/janishuber/finpath-frontend-mobile:prod
    depends_on:
      - backend
    ports:
      - "8081:80"   # z.B. http://server:8081 für mobile Preview im Browser
    restart: always

volumes:
  db_data: