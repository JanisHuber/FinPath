version: "3.9"

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: finpath-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      # später: - "443:443" mit TLS
    depends_on:
      - frontend-web-prod
      - backend-prod
      # dev-stack kann separat laufen
    networks:
      - finpath-net
    restart: always

  db-prod:
    image: postgres:16
    container_name: finpath-db-prod
    env_file: ./secrets/.env.db.prod
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    networks:
      - finpath-net
    restart: always

  backend-prod:
    image: ghcr.io/janishuber/finpath-backend:prod
    container_name: finpath-backend-prod
    env_file: ./secrets/.env.prod
    environment:
      DB_HOST: db-prod
      DB_PORT: 5432
    expose:
      - "9080"
    depends_on:
      - db-prod
    networks:
      - finpath-net
    restart: always

  frontend-web-prod:
    image: ghcr.io/janishuber/finpath-frontend-web:prod
    container_name: finpath-frontend-web-prod
    expose:
      - "80"
    depends_on:
      - backend-prod
    networks:
      - finpath-net
    restart: always

volumes:
  db_data_prod:

networks:
  finpath-net:
    external: true