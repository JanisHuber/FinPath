name: Build & Deploy (prod)

on:
  push:
    branches: [ "prod" ]

concurrency:
  group: build-deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/finpath
  IMAGE_PREFIX_LOWER: ghcr.io/janishuber/finpath

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend JAR
        run: mvn -B -q -T 1C -DskipTests clean package --file apps/finpath-backend/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/finpath-backend
          file: ./apps/finpath-backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_PREFIX_LOWER }}-backend:prod
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/finpath-frontend-web
          file: ./apps/finpath-frontend-web/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_PREFIX_LOWER }}-frontend-web:prod
          build-args: BUILD_CONFIG=production
          cache-from: type=gha,scope=frontend-web-prod
          cache-to: type=gha,mode=max,scope=frontend-web-prod

  migrate-database:
    name: Run Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PASS_PRD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF_PRD }}

      - name: Push migrations to prod
        run: supabase db push

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, migrate-database]
    steps:
      - name: Deploy to Hetzner PROD
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/finpath/ops
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
