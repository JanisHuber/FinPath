name: CI/CD (dev)

on:
  push:
    branches: [ "dev" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/finpath

concurrency:
  group: finpath-dev
  cancel-in-progress: true

jobs:

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run backend tests
        run: mvn -B -q test --file apps/finpath-backend/pom.xml

  build-images:
    name: Build & Publish Images
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build backend WAR
        run: mvn -B -q -DskipTests clean package --file apps/finpath-backend/pom.xml

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Images (backend + web + mobile)
        uses: docker/bake-action@v4
        with:
          files: |
            ./docker-bake.hcl
          push: true
          provenance: false

  deploy-dev:
    name: Deploy to Hetzner
    needs: build-images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/finpath-dev
            git pull
            docker compose -f ops/compose.dev.yml pull
            docker compose -f ops/compose.dev.yml up -d