name: Build & Publish (dev)

on:
  push:
    branches: [ "dev" ]

concurrency:
  group: build-publish-dev
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/finpath

jobs:
  # ========== TESTING (parallel) ==========
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven  # NEW: Cache Maven dependencies

      - name: Run backend tests
        run: mvn -B -q test --file apps/finpath-backend/pom.xml

  # ========== BUILD (parallel after tests) ==========
  build-backend:
    runs-on: ubuntu-latest
    needs: test-backend  # Wait for tests to pass
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven  # NEW: Reuse cached dependencies

      - name: Build backend WAR (Maven)
        run: mvn -B -q -DskipTests clean package --file apps/finpath-backend/pom.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=raw,value=dev
            type=sha
          labels: |
            org.opencontainers.image.title=finpath-backend
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push (backend)
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/finpath-backend
          file: ./apps/finpath-backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev
          provenance: mode=min

      - name: Attest backend image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-backend
          subject-digest: ${{ steps.build_backend.outputs.digest }}
          push-to-registry: true

  build-frontend-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (frontend web)
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-frontend-web
          tags: |
            type=raw,value=dev
            type=sha
          labels: |
            org.opencontainers.image.title=finpath-frontend-web
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build & Push (frontend web)
        id: build_web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/finpath-frontend-web
          file: ./apps/finpath-frontend-web/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          cache-from: type=gha,scope=frontend-web-dev
          cache-to: type=gha,mode=max,scope=frontend-web-dev
          provenance: mode=min

      - name: Attest web image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-frontend-web
          subject-digest: ${{ steps.build_web.outputs.digest }}
          push-to-registry: true

  # ========== DEPLOY (after all builds complete) ==========
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend-web]
    steps:
      - name: Deploy to Hetzner DEV
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            sudo chown -R $USER:$USER /opt/finpath
            cd /opt/finpath
            git config --global --add safe.directory /opt/finpath
            git pull origin dev
            cd ops
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d
