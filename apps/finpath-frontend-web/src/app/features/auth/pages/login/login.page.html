<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="rounded-2xl bg-bg-soft p-8 shadow-sm border border-slate-800/50">
      <h1 class="text-3xl font-bold mb-6 text-center">Anmelden</h1>

      @if (error) {
        <div class="mb-4 p-3 rounded-lg bg-red-500/20 border border-red-500/50 text-red-300 text-sm">
          {{ error }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-300 mb-1">E-Mail</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            required
            class="w-full px-4 py-2 rounded-lg bg-bg border border-slate-700 text-slate-200 focus:outline-none focus:border-slate-500"
            placeholder="deine@email.ch"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Passwort</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
            class="w-full px-4 py-2 rounded-lg bg-bg border border-slate-700 text-slate-200 focus:outline-none focus:border-slate-500"
            placeholder="Passwort"
          />
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-2 px-4 rounded-lg bg-slate-700 hover:bg-slate-600 text-white font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ loading ? 'Wird geladen...' : 'Anmelden' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-400">
        Noch kein Konto?
        <a routerLink="/register" class="text-slate-200 hover:underline">Registrieren</a>
      </p>
    </div>
  </div>
</div>
