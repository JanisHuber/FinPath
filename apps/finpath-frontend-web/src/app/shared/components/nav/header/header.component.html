<header class="w-full bg-bg-soft border-b border-slate-800/50">
  <div class="h-16 flex items-center gap-3 px-4 lg:px-6">
    <div class="ml-auto flex items-center gap-2 sm:gap-3">
      <!-- Notifications -->
      <div class="relative">
        <button
          (click)="toggleNotifications()"
          class="h-10 w-10 rounded-xl hover:bg-slate-800/60 inline-flex items-center justify-center transition relative"
          [attr.aria-label]="'app.notifications' | translate"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M14.25 18.75a2.25 2.25 0 11-4.5 0m9-4.5V11a6.75 6.75 0 10-13.5 0v3.25L3 16.5h18l-2.25-2.25z"
            />
          </svg>
          @if (unreadNotificationsCount > 0) {
            <span class="absolute -top-1 -right-1 h-5 w-5 rounded-full bg-red-500 text-xs font-medium flex items-center justify-center">
              {{ unreadNotificationsCount > 9 ? '9+' : unreadNotificationsCount }}
            </span>
          }
        </button>

        <!-- Notifications Dropdown -->
        @if (showNotificationsDropdown) {
          <div class="absolute right-0 mt-2 w-72 sm:w-80 rounded-xl bg-bg-soft border border-slate-700/60 shadow-lg z-50">
            <div class="p-3 border-b border-slate-700/60">
              <h3 class="font-medium">{{ 'notifications.title' | translate }}</h3>
            </div>
            <div class="p-4 text-center text-slate-400 text-sm">
              {{ 'notifications.noNotifications' | translate }}
            </div>
          </div>
        }
      </div>

      <!-- User Badge -->
      <div class="relative">
        <button
          (click)="toggleUserDropdown()"
          class="group h-10 pl-2 sm:pl-3 pr-2 rounded-xl hover:bg-slate-800/80 border border-slate-700/60 inline-flex items-center gap-2 sm:gap-3 transition"
        >
          <div class="text-right leading-tight hidden sm:block">
            <div class="text-sm font-medium">{{ profile?.displayName || '...' }}</div>
            <div class="text-[11px] text-slate-400 truncate max-w-[150px]">{{ userEmail }}</div>
          </div>
          <div
            class="h-8 w-8 rounded-full bg-slate-700 grid place-items-center text-sm font-semibold"
          >
            {{ userInitials }}
          </div>
        </button>

        <!-- User Dropdown -->
        @if (showUserDropdown) {
          <div class="absolute right-0 mt-2 w-48 rounded-xl bg-bg-soft border border-slate-700/60 shadow-lg z-50">
            <div class="p-2">
              <a
                routerLink="/settings/profile"
                class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-800/60 transition text-sm"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                {{ 'app.profile' | translate }}
              </a>
              <a
                routerLink="/settings"
                class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-800/60 transition text-sm"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                {{ 'app.settings' | translate }}
              </a>
              <hr class="my-2 border-slate-700/60" />
              <button
                (click)="logout()"
                class="w-full flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-800/60 transition text-sm text-red-400"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                {{ 'app.logout' | translate }}
              </button>
            </div>
          </div>
        }
      </div>

      <!-- Language Switcher -->
      <select
        (change)="switchLang($any($event.target).value)"
        [value]="currentLang"
        class="h-10 px-2 sm:px-3 rounded-xl bg-slate-800/60 border border-slate-700/60 text-sm hover:bg-slate-800/80 transition cursor-pointer"
        [attr.aria-label]="'settings.appSettings.language' | translate"
      >
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="en">EN</option>
      </select>
    </div>
  </div>
</header>
