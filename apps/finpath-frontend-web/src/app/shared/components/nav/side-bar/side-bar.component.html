<div class="flex flex-col w-64 border-r border-slate-800/50 h-screen">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-slate-800/50">
    <div class="flex items-center gap-2">
      <div class="h-8 w-8 rounded-xl bg-linear-to-br from-emerald-400 to-blue-500"></div>
      <span class="font-semibold text-gray-800 text-lg">FinPath</span>
    </div>

    <!-- Avatar + Carets -->
    <div class="flex items-center gap-2 cursor-pointer">
      <img
        src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png"
        alt="User avatar"
        class="w-9 h-9 rounded-full"
      />
      <div class="flex flex-col items-center justify-center text-gray-500">
        <!-- Caret Up -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-3 w-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
        </svg>
        <!-- Caret Down -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-3 w-3 -mt-0.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </div>
  </div>

      class="flex items-center gap-3 px-3 py-2 rounded-lg text-gray-700 hover:bg-slate-800/60 transition"

        viewBox="0 0 24 24"
        stroke="currentColor"

        <path

          stroke-width="1.5"

        />

      {{ 'app.dashboard' | translate }}

    <a
