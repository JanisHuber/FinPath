<div class="flex flex-col w-64 border-r border-slate-800/50 h-screen bg-bg-soft">
  <!-- Header -->
  <div class="flex items-center justify-between p-4 border-b border-slate-800/50">
    <div class="flex items-center gap-2">
      <div class="h-8 w-8 rounded-xl bg-gradient-to-br from-emerald-400 to-blue-500"></div>
      <span class="font-semibold text-lg">FinPath</span>
    </div>

    <!-- Avatar + User Info -->
    <div class="flex items-center gap-2 cursor-pointer group">
      <div class="h-9 w-9 rounded-full bg-slate-700 grid place-items-center text-sm font-semibold">
        {{ userInitials }}
      </div>
      <div class="flex flex-col items-center justify-center text-slate-500 group-hover:text-slate-400 transition">
        <!-- Caret Up -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-3 w-3"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
        </svg>
        <!-- Caret Down -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-3 w-3 -mt-0.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M19 9l-7 7-7-7"
          />
        </svg>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 pt-4 px-2 space-y-1 overflow-y-auto">
    @for (item of navItems; track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-slate-800/80 text-white"
        [routerLinkActiveOptions]="{ exact: item.route === '/settings' ? false : item.route === '/dashboard' }"
        (click)="onLinkClick()"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800/60 hover:text-slate-200 transition"
      >
        <app-icon-component [iconName]="item.icon" class="h-5 w-5"></app-icon-component>
        {{ item.labelKey | translate }}
      </a>
    }
  </nav>

  <!-- Footer -->
  <div class="p-4 border-t border-slate-800/50">
    <div class="text-xs text-slate-500 text-center">
      FinPath v1.0.0
    </div>
  </div>
</div>
