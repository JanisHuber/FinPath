spring:
  application:
    name: finpath

  # Supabase Database Configuration (Session Pooler)
  # Expects JDBC_URL with embedded credentials
  # Example: jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres?user=postgres.xxx&password=xxx
  datasource:
    url: ${JDBC_URL}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Server Configuration
server:
  port: 9080
  shutdown: graceful

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration
logging:
  level:
    root: INFO
    ch.finpath: INFO
