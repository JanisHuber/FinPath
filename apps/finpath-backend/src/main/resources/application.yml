spring:
  application:
    name: finpath

  # Database Configuration - Uses environment variables for security
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finpath}
    username: ${DB_USER:finpath}
    password: ${DB_PASS}  # REQUIRED - no default for security
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000

  # JPA/Hibernate Configuration - Common settings for all environments
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Server Configuration
server:
  port: ${SERVER_PORT:9080}
  shutdown: graceful

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Logging Configuration - Base configuration (overridden by profiles)
logging:
  level:
    root: INFO
    ch.finpath: INFO
