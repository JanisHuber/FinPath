# ===========================================
# PRODUCTION (Supabase Cloud - Prod Project)
# ===========================================

spring:
  jpa:
    show-sql: false

server:
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

management:
  endpoint:
    health:
      show-details: never

cors:
  allowed-origins: https://css-appli24.com

logging:
  level:
    root: WARN
    ch.finpath: INFO
